[workspace]

[package]
name = "zap"
version = "0.2.1"
edition = "2021"
rust-version = "1.75"
description = "ZAP — Zero-copy Application Protocol"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zap-proto/spec"
homepage = "https://zap-proto.dev"
documentation = "https://zap-proto.dev/docs"
keywords = ["zap", "rpc", "agents", "mcp", "ai"]
categories = ["network-programming", "development-tools"]
readme = "README.md"

[lib]
name = "zap"
path = "src/lib.rs"

[[bin]]
name = "zap"
path = "src/bin/zap.rs"

[[bin]]
name = "zapd"
path = "src/bin/zapd.rs"

[dependencies]
# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors
thiserror = "2"
anyhow = "1"

# Hashing (for Ringtail consensus)
blake3 = "1.5"

# Encoding (for DID multibase)
bs58 = "0.5"
hex = "0.4"

# Network
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tokio-tungstenite = "0.24"
tokio-util = { version = "0.7", features = ["codec"] }
url = "2"

# Config
directories = "5"

# Post-Quantum Cryptography (optional, requires 'pq' feature)
pqcrypto-mlkem = { version = "0.1", optional = true }
pqcrypto-dilithium = { version = "0.5", optional = true }
pqcrypto-traits = { version = "0.3", optional = true }
x25519-dalek = { version = "2.0", optional = true }
hkdf = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true }
zeroize = { version = "1.7", optional = true }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"

[features]
default = []
mcp = []
pq = ["pqcrypto-mlkem", "pqcrypto-dilithium", "pqcrypto-traits", "x25519-dalek", "hkdf", "sha2", "rand", "zeroize"]

[profile.release]
lto = true
codegen-units = 1
strip = true
